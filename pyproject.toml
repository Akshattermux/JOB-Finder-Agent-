[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-job-agent"
version = "0.1.0"
description = "Hybrid Job-Application Agent powered by Python, Playwright, SQLite, and Gemini API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=0.1.1",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
job-agent = "cli:main"
